[package]
name = "orazaka-desktop"
version = "0.2.0"
description = "Orazaka Desktop — control panel and file bridge for the Orazaka sovereign AI platform"
authors = ["Krizaka"]
edition = "2021"
license = "FSL-1.1-ALv2"
rust-version = "1.80"

[lib]
name = "orazaka_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
krizaka-tauri-kit = { git = "https://github.com/krizaka/krizaka-tauri-kit", tag = "v0.3.0", features = ["keychain"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
base64 = "0.23"
url = "2"
# automations (ADR-079): schedule in local time, hash-chained audit, run ids, the model port, PDF text
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
pdf-extract = "0.12"
# code on the Mac (ADR-093): token redaction and exact per-hunk diffs
regex = "1"
similar = "3"
# checks (ADR-093 slice 2): kill the whole process group of a timed-out run
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# unwind, not abort: a malformed PDF that panics in the text extractor fails that file, not the app
panic = "unwind"
strip = true
