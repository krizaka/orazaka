[package]
name = "orazaka-desktop"
version = "0.1.0"
description = "Orazaka Desktop — control panel and file bridge for the Orazaka sovereign AI platform"
authors = ["Krizaka"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[lib]
name = "orazaka_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
base64 = "0.22"
url = "2"
sha2 = "0.10"
getrandom = "0.3"
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
