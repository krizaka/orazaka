# Optimization #3 — parallel E2E execution.
# Classes run CONCURRENTLY (each UI IT has its own isolated BrowserContext via
# AbstractUiE2eTest, sharing the single suite-wide browser), while methods within a class
# stay on the SAME thread so the @Order'd, page-stateful flows run sequentially as authored.
# NOTE: the ITs share one live backend (Postgres/Redis/RabbitMQ/router); verify against your
# stack and dial parallelism down if data-coupled flows race.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
junit.jupiter.execution.parallel.config.fixed.max-pool-size=4
