# Dependabot — the Krizaka model (monthly, quiet; DEPS 2026-10-13, krizaka/.github).
# Once a month (the 1st, 06:00 Paris), ONE grouped pull request per ecosystem — every update, majors included — and at
# most one open per ecosystem. Security fixes stay on and arrive grouped apart, as soon as an advisory is published.
# The ignore rules below are decisions, not oversights: Node LTS only (22/24), PostgreSQL 16 (parity with the
# DigitalOcean databases), TypeScript 7 / ESLint 10 only once @krizaka/config supports them (krizaka/krizaka-ui#141),
# the Expo SDK pins its own toolchain, and each deferred major names its tracking issue.
# A grouped pull request is merged when CI is green; a major that breaks it gets an ignore rule here and an issue.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directories: ["/orazaka-apps/ui", "/.agent/mcp-server"]
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Node majors are a decision, not a bump: LTS only (22/24), moved by hand
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) waits for @krizaka/config and typescript-eslint (krizaka-ui#141)
      - dependency-name: "typescript"
        versions: [">=7"]
      # types of the Node LTS we run (22/24), never a non-LTS line
      - dependency-name: "@types/node"
        versions: [">=25"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: "/infra/compute-nodes"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Node majors are a decision, not a bump: LTS only (22/24), moved by hand
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # no worker tests, image not buildable; krizaka/orazaka#59
      - dependency-name: "pytorch/pytorch"
    commit-message:
      prefix: "chore(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: "/infra"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Node majors are a decision, not a bump: LTS only (22/24), moved by hand
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # PostgreSQL 16 = the DigitalOcean databases
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
