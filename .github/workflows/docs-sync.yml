# Keeps docs/_generated in step with the workspace. The generated docs read the default branches of the other
# repositories (packs, services, UI kit), so they drift when those move, not only when this repository does.
# Every day this regenerates them on a full workspace clone and, when they differ, opens or updates the pull request
# `chore/docs-sync`; the required checks then run on it like on any other change.
#
# A pull request opened with the default GITHUB_TOKEN does not start the workflows that are required on main, so the
# PR can only merge when DOCS_SYNC_TOKEN (a fine-grained token: contents + pull requests on krizaka/orazaka) is set.
name: docs-sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Clone the workspace repositories at their default branches
        run: node scripts/workspace.mjs clone --depth 1

      - name: Regenerate the docs
        run: node scripts/generate-docs.mjs

      - name: Open or update the pull request when the docs drifted
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN || github.token }}
        run: |
          if git diff --quiet -- docs/_generated; then
            echo "docs/_generated is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/docs-sync
          git add docs/_generated
          git commit -m "docs: regenerate docs/_generated (the workspace moved)"
          git push --force origin chore/docs-sync  # bot-owned branch: rebuilt from main every run
          if gh pr list --repo "$GITHUB_REPOSITORY" --head chore/docs-sync --state open --json number --jq '.[0].number' | grep -q .; then
            echo "pull request already open: updated by the push"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head chore/docs-sync \
              --title "docs: regenerate docs/_generated (the workspace moved)" \
              --body "Daily sync: the generated docs differ from the default branches of the workspace repositories. Generated by .github/workflows/docs-sync.yml; only docs/_generated changes."
          fi
