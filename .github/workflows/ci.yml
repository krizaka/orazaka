# The workspace pipeline: clones every repository and builds the whole platform in one reactor —
# unit and Testcontainers integration tests, cross-repository governance rules, the UI workspace
# and the docs freshness gate. A change in any repository is only finished when this is green.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # the queue runs the full reactor; a pull request runs the plan of scripts/ci-plan.mjs
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly: the default branches of every repository, together

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a change in THIS repository can break. The Java and Python sources live in the other repositories (cloned at their
  # main and tested by their own CI); here, a docs / scripts / deploy-infra / ADR / .agent change cannot change the outcome
  # of the 12-minute reactor build or of the UI workspace build. They run when the reactor, the end-to-end module, the SQL the
  # tests replay, the workspace manifest or this workflow change — and always on the nightly, dispatch and on every
  # other event (krizaka/.github changes.yml fails open). The docs freshness gate and the workspace script tests always run.
  maven-changes:
    uses: krizaka/.github/.github/workflows/changes.yml@99281c3f4b46dbe4c645dff053b4bfb387a1403d # main
    with:
      relevant: '^(pom\.xml|\.mvn/|mvnw(\.cmd)?$|orazaka-end2end/|infra/(initdb|migrations|users|brokers-infra|docker-compose)|orazaka\.workspace\.json|scripts/workspace\.mjs|\.github/workflows/ci\.yml$)'
  ui-changes:
    uses: krizaka/.github/.github/workflows/changes.yml@99281c3f4b46dbe4c645dff053b4bfb387a1403d # main
    with:
      relevant: '^(orazaka-apps/ui/|orazaka\.workspace\.json|scripts/workspace\.mjs|\.github/workflows/ci\.yml$)'

  workspace:
    # The required check keeps its name; `!cancelled()` so that a failed gate job runs everything (fail open).
    needs: [maven-changes, ui-changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read   # the Krizaka releases not yet on Central resolve from GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2 # HEAD^1 = the base of the pull request's merge commit (the changed-files plan)

      - name: Clone every repository
        run: node scripts/workspace.mjs clone --depth 1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: ${{ needs.maven-changes.outputs.code != 'false' }}
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # A Krizaka release waits for a human to press Publish on Central; development builds resolve it from GitHub Packages.
      - uses: krizaka/.github/actions/maven-github-packages@99281c3f4b46dbe4c645dff053b4bfb387a1403d # main
        if: ${{ needs.maven-changes.outputs.code != 'false' }}
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Workspace scripts
        timeout-minutes: 10 # these tests take seconds: a hang is a bug, not a slow run (orazaka#530: 90 min lost)
        run: node --test --test-timeout=120000 --test-force-exit 'scripts/test/*.test.mjs'

      - name: Krizaka versions are provided
        # The BOM may only name a com.krizaka release that a cloned repository builds or Maven Central carries
        # (Central's free quota can be out, a tag unpublished): fails here, by artifact, not deep in the reactor.
        env:
          PACKAGES_READ_CREDENTIAL: ${{ github.token }} # `packages: read`: blocks published on GitHub Packages only (ADR-019)
        run: node scripts/check-krizaka-versions.mjs

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Worker test dependencies
        run: python -m pip install --quiet pytest pyyaml pika Pillow psutil cryptography coverage

      - name: Media worker contract
        working-directory: orazaka-apps/workers/orazaka-worker-media
        run: python -m pytest -q test_capability_contract.py

      - name: Derive the UI workspace lock from the cloned members
        if: ${{ needs.ui-changes.outputs.code != 'false' }}
        # The members are cloned from their repositories' main: their dependency bumps must not break this build.
        working-directory: orazaka-apps/ui
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund

      # ADR-018 budgets (krizaka-internal#2024): PR feedback < 10 min, merge_group < 15 min. Every other repository is
      # cloned at its main and verified by its own CI, so a pull request compiles the whole reactor (tests deferred) and
      # tests the changed modules + their dependents; merge_group, main, the nightly, dispatch and anything shared
      # (scripts/ci-plan.mjs) run every test. The deferred build also defers the static analysis (SpotBugs, PMD, Spotless,
      # JaCoCo) of modules the pull request does not touch; the changed modules below run the whole lifecycle. Modules build in parallel (-T): Testcontainers pick random ports.
      - name: Plan (what this event must test)
        id: plan
        if: ${{ needs.maven-changes.outputs.code != 'false' }}
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/ci-plan.mjs --event "$EVENT" --diff HEAD^1

      - name: Build and test the platform
        if: ${{ needs.maven-changes.outputs.code != 'false' && steps.plan.outputs.mode == 'full' }}
        run: >
          ./mvnw -B -ntp -T 4 install
          -Dpython.executable=python
          -Dexec.skip=true
          -Dskip.npm=true
          -Dskip.installnodenpm=true

      - name: Build the platform (tests of the changed modules follow)
        if: ${{ needs.maven-changes.outputs.code != 'false' && steps.plan.outputs.mode == 'changed' }}
        run: >
          ./mvnw -B -ntp -T 4 install -DskipTests
          -Dspotbugs.skip=true -Dpmd.skip=true -Dcpd.skip=true -Dspotless.check.skip=true -Djacoco.skip=true
          -Dpython.executable=python
          -Dexec.skip=true
          -Dskip.npm=true
          -Dskip.installnodenpm=true

      - name: Test the changed modules and their dependents
        if: ${{ needs.maven-changes.outputs.code != 'false' && steps.plan.outputs.mode == 'changed' && steps.plan.outputs.pl != '' }}
        env:
          MODULES: ${{ steps.plan.outputs.pl }}
        run: >
          ./mvnw -B -ntp verify -pl "$MODULES" -amd
          -Dpython.executable=python
          -Dexec.skip=true
          -Dskip.npm=true
          -Dskip.installnodenpm=true

      - name: UI workspace
        if: ${{ needs.ui-changes.outputs.code != 'false' }}
        working-directory: orazaka-apps/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build:shared
          npm run validate

      - name: Docs are generated from this code
        # The generated docs also read the default branches of the other repositories, so they drift when those merge,
        # whoever opens the pull request. A pull request is held to the gate only when it touches what the docs are
        # made from here (docs, scripts, infra, the workspace manifest); any other drift is a warning, and docs-sync
        # (daily, CI dispatched on its branch) brings main back in step.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          node scripts/generate-docs.mjs --check && exit 0
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --quiet --depth=1 origin "$BASE"
            if git diff --name-only "origin/$BASE" HEAD | grep -qE '^(docs/|scripts/|infra/|AGENTS\.md|README\.md|orazaka\.workspace\.json)'; then
              echo "::error::docs are stale and this pull request touches what they are made from"
              exit 1
            fi
          fi
          echo "::warning::docs/_generated drifted from the workspace; the docs-sync workflow opens the pull request"

  # The required « SonarCloud Code Analysis » is posted by the SonarCloud app once this scan has run. The app's automatic analysis
  # never sees a merge queue SHA, so the scan runs on every event the required checks run on, merge_group included
  # (krizaka-internal#2000). The Java and Python sources are analysed by the CI of their own repositories.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: The token is there
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::error::SONAR_TOKEN is empty: it is an org secret (a Dependabot secret too)"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # blame and new-code detection need the history
          persist-credentials: false
      - uses: krizaka/.github/actions/sonar-scan@99281c3f4b46dbe4c645dff053b4bfb387a1403d # main
        with:
          token: ${{ secrets.SONAR_TOKEN }}
          args: -Dsonar.qualitygate.wait=true

  # Main must not go red unnoticed: a failed run on main opens (or updates) a single issue.
  red-main:
    needs: workspace
    if: ${{ always() && needs.workspace.result == 'failure' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the "main is red" issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          body="CI failed on main at ${SHA:0:7}: ${RUN_URL}"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search '"main is red" in:title' --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "main is red" --body "$body"
          fi
