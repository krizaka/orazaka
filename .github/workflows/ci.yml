# The workspace pipeline: clones every repository and builds the whole platform in one reactor —
# unit and Testcontainers integration tests, cross-repository governance rules, the UI workspace
# and the docs freshness gate. A change in any repository is only finished when this is green.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly: the default branches of every repository, together

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clone every repository
        run: node scripts/workspace.mjs clone --depth 1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Workspace scripts
        run: node --test 'scripts/test/*.test.mjs'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Worker test dependencies
        run: python -m pip install --quiet pytest pyyaml pika Pillow psutil cryptography coverage

      - name: Media worker contract
        working-directory: orazaka-apps/workers/orazaka-worker-media
        run: python -m pytest -q test_capability_contract.py

      - name: Derive the UI workspace lock from the cloned members
        # The members are cloned from their repositories' main: their dependency bumps must not break this build.
        working-directory: orazaka-apps/ui
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund

      - name: Build and test the platform
        run: >
          ./mvnw -B -ntp install
          -Dpython.executable=python
          -Dexec.skip=true
          -Dskip.npm=true
          -Dskip.installnodenpm=true

      - name: UI workspace
        working-directory: orazaka-apps/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build:shared
          npm run validate
          npm run validate:admin

      - name: Docs are generated from this code
        run: node scripts/generate-docs.mjs --check

  # Main must not go red unnoticed: a failed run on main opens (or updates) a single issue.
  red-main:
    needs: workspace
    if: ${{ always() && needs.workspace.result == 'failure' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the "main is red" issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          body="CI failed on main at ${SHA:0:7}: ${RUN_URL}"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search '"main is red" in:title' --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "main is red" --body "$body"
          fi
