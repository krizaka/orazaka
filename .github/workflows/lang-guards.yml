# Rust guards of the org (krizaka-internal#2115): rustfmt, clippy pedantic counted in lang-ratchet.json (debt only goes down),
# cargo-deny, tests under a timeout. Reusable workflow of krizaka/.github, pinned by sha.
name: lang-guards

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lang-guards-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/rust-quality.yml@0f4bdc5a3fc4facd03a20571da5c6e65abed9dd1 # main
    with:
      working-directory: apps/desktop/src-tauri
      runs-on: macos-latest
      prepare: node ../scripts/build-sidecar.mjs
      timeout-minutes: 30
