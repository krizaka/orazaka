# Reusable pipeline of every Orazaka repository (each one's .github/workflows/ci.yml calls it).
#
# A component is always verified INSIDE the workspace: this repository is checked out, every other
# repository is cloned at its workspace path from its default branch, the calling repository is put
# at its own path at the commit being tested, and `node scripts/workspace.mjs ci <component>` builds
# its upstream repositories from source before verifying it. The cross-repository governance rules
# therefore run in CI exactly as they do in a local workspace — nothing is skipped.
#
# On a v* tag the component is published (AGENTS.md §0): Maven artifacts to GitHub Packages
# (maven.pkg.github.com/krizaka/<repository>), @krizaka/* npm packages to npmjs with provenance
# (trusted publishing: the calling workflow grants id-token: write).
name: component

on:
  workflow_call:
    inputs:
      component:
        description: "Repository name, as listed in orazaka.workspace.json"
        required: true
        type: string
      rewrite:
        description: "Fail when an OpenRewrite recipe of krizaka-parent would change code (rewrite:dryRun). A repository turns it on in the pull request that applies rewrite:run."
        required: false
        default: false
        type: boolean
      duplication:
        description: "Run the duplicate-code check (krizaka/.github actions/dup-check: jscpd + the repository's dup-ratchet.json, which may only go down)."
        required: false
        default: false
        type: boolean
      ignore:
        description: "changes.yml: JavaScript RegExp, a changed file matching it never needs the build. Keep out of it every file the governance rules read (AGENTS.md, docs, READMEs): the default only skips files no build can read."
        required: false
        default: '^\.changeset/|^(LICENSE|NOTICE|SECURITY|CODE_OF_CONDUCT|SUPPORT)(\.md)?$|^\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'
        type: string

      sonar:
        description: "Run the SonarCloud CI analysis after verify (jobs `sonar` / `sonar-light`, project settings in the repository's sonar-project.properties). Turn off the project's automatic analysis once it is green."
        required: false
        default: false
        type: boolean
      sonar-coverage-paths:
        description: "Newline-separated files verify uploads for the analysis, relative to the component (JaCoCo report and compiled classes for a Maven repository, coverage/lcov.info for a UI one). Globs allowed."
        required: false
        default: |
          **/target/site/jacoco/jacoco.xml
          **/target/classes
        type: string
      sonar-args:
        description: "Extra scanner arguments."
        required: false
        default: ""
        type: string
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud token (the org secret). Required when `sonar` is true; never printed."
        required: false

permissions:
  contents: read

jobs:
  # A change that no build can read (licence, templates, changesets) skips the heavy job: the required check
  # `component / verify` reports « Skipped », which branch protection counts as passing. Fail-open: the job runs unless
  # the gate answered exactly `false` (a tag, a schedule, a dispatch and a broken gate run in full).
  changes:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/changes.yml@52867e939aae51e061389109d52b1e463f8fe72f # main
    with:
      ignore: ${{ inputs.ignore }}

  duplication:
    # No copy-pasted code (org rule 2026-10-22): the duplicated lines of the calling repository may only go down.
    needs: changes
    if: ${{ inputs.duplication && !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: krizaka/.github/actions/dup-check@1cb2e1b6f572ba712083cb6f05fd041370c5ea0b # v1.5.0

  verify:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 60
    steps:
      - name: Check out the Orazaka workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: krizaka/orazaka
          path: workspace

      - name: Check out ${{ inputs.component }} at the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: incoming

      - name: Place the component at its workspace path
        working-directory: workspace
        run: |
          target=$(node -e "const m=require('./orazaka.workspace.json');const r=m.repositories.find(x=>x.name==='${{ inputs.component }}');if(!r){process.exit(2)}console.log(r.path)")
          mkdir -p "$(dirname "$target")"
          mv ../incoming "$target"

      - name: Clone every other repository
        working-directory: workspace
        run: node scripts/workspace.mjs clone --depth 1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          scope: "@krizaka"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify ${{ inputs.component }} against its upstreams
        working-directory: workspace
        run: node scripts/workspace.mjs ci "${{ inputs.component }}"

      # The recipes live in krizaka-parent (every repository inherits them). A change a recipe would make is
      # debt: `./mvnw rewrite:run` then `./mvnw spotless:apply` (twice until clean), run the tests, commit.
      - name: OpenRewrite — no change pending
        if: inputs.rewrite
        working-directory: workspace
        run: |
          target=$(node -e "const m=require('./orazaka.workspace.json');console.log(m.repositories.find(x=>x.name==='${{ inputs.component }}').path)")
          cd "$target" && ./mvnw -B -ntp rewrite:dryRun

      - name: Collect the coverage for SonarCloud
        if: ${{ inputs.sonar }}
        working-directory: workspace
        env:
          PATHS: ${{ inputs.sonar-coverage-paths }}
          OUT: ${{ runner.temp }}/sonar-coverage.tar
        run: |
          target=$(node -e "const m=require('./orazaka.workspace.json');console.log(m.repositories.find(x=>x.name==='${{ inputs.component }}').path)")
          cd "$target"
          shopt -s globstar nullglob
          files=()
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            # shellcheck disable=SC2206  # the pattern is a glob on purpose
            matches=($pattern)
            files+=("${matches[@]}")
          done <<< "$PATHS"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::no coverage report found ($PATHS): the analysis runs without coverage and the new-code coverage condition will fail"
            tar -cf "$OUT" --files-from /dev/null
          else
            tar -cf "$OUT" "${files[@]}"
            echo "collected: ${files[*]}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.sonar }}
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage.tar
          retention-days: 1
          if-no-files-found: error

      - name: npm with trusted publishing
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm install -g npm@11

      - name: Publish (Maven → GitHub Packages, npm → npmjs)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: workspace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/workspace.mjs publish "${{ inputs.component }}"

  # A docs-only change skips the heavy jobs, yet the required « SonarCloud Code Analysis » must still be posted by the SonarCloud app:
  # a light scan (checkout, no build, no tests, no coverage) does it, and its quality gate is real on the changed files (.github#330).
  # Never a synthetic status: that would forge a check which belongs to another app.
  sonar-light:
    name: SonarCloud (docs only)
    needs: changes
    if: ${{ inputs.sonar && !cancelled() && needs.changes.outputs.code == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: The token is there
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::error::SONAR_TOKEN is empty: pass the org secret to the workflow (secrets: SONAR_TOKEN) and, for Dependabot, add it as a Dependabot secret"; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # blame and new-code detection need the history
          persist-credentials: false

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: .
          args: -Dsonar.qualitygate.wait=true -Dsonar.java.binaries=. ${{ inputs.sonar-args }}

  sonar:
    name: SonarCloud
    needs: [changes, verify]
    if: ${{ inputs.sonar && !cancelled() && needs.changes.outputs.code != 'false' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: The token is there
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::error::SONAR_TOKEN is empty: pass the org secret to the workflow (secrets: SONAR_TOKEN) and, for Dependabot, add it as a Dependabot secret"; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # blame and new-code detection need the history
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage

      - name: Restore the reports
        env:
          TAR: ${{ runner.temp }}/sonar-coverage/sonar-coverage.tar
        run: tar -xf "$TAR"

      # CI analysis: the SonarCloud app still decorates the pull request and posts « SonarCloud Code Analysis »; the quality gate is awaited
      # here so the CI gate carries its verdict too.
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: .
          args: -Dsonar.qualitygate.wait=true ${{ inputs.sonar-args }}

  # ALWAYS reports (see java-ci.yml): green when verify succeeded or the changes gate legitimately skipped it; the merge queue
  # and branch protection can require this one name whatever the change.
  gate:
    name: CI gate
    needs: [changes, verify, sonar, sonar-light]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    steps:
      - id: verdict
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          SONAR: ${{ needs.sonar.result }}
          SONAR_WANTED: ${{ inputs.sonar }}
          SONAR_LIGHT: ${{ needs.sonar-light.result }}
        run: |
          fail=0
          echo "gate: code=${CODE:-unknown} changes=$CHANGES verify=$VERIFY"
          [ "$CHANGES" = success ] || echo "::warning::the changes gate did not succeed ($CHANGES): the job ran in full"
          case "$VERIFY" in success|skipped) ;; *) echo "::error::verify $VERIFY"; fail=1 ;; esac
          case "${SONAR:-skipped}" in success|skipped) ;; *) echo "::error::sonar $SONAR"; fail=1 ;; esac
          if [ "$CODE" != "false" ] && [ "$VERIFY" != success ]; then
            echo "::error::verify must run when the gate did not answer false"; fail=1
          fi
          if [ "$CODE" != "false" ] && [ "${SONAR_WANTED:-false}" = "true" ] && [ "$VERIFY" = success ] && [ "${SONAR:-skipped}" != success ]; then
            echo "::error::sonar must run and succeed when the gate did not answer false"; fail=1
          fi
          if [ "$CODE" = "false" ] && [ "${SONAR_WANTED:-false}" = "true" ] && [ "${SONAR_LIGHT:-skipped}" != success ]; then
            echo "::error::sonar-light must run and succeed on a docs-only change"; fail=1
          fi
          case "${SONAR_LIGHT:-skipped}" in success|skipped) ;; *) echo "::error::sonar-light $SONAR_LIGHT"; fail=1 ;; esac
          if [ "$fail" = 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### CI gate"
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| changes | $CHANGES (code=${CODE:-unknown}) |"
            echo "| verify | $VERIFY |"
            echo "| sonar | ${SONAR:-skipped} |"
            echo "| sonar-light | ${SONAR_LIGHT:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
