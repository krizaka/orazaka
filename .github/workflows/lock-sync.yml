# Keeps orazaka-apps/ui/package-lock.json in step with the components' floors. The workspace job runs `npm ci` there; when a
# component repository raises a floor (@krizaka/ui ^3.40.0) and this lock still resolves the old version, `npm ci` fails and
# every pull request of the workspace goes red (scripts/test/ui-lock-floors.test.mjs says so). Every few hours this clones the
# components at their default branches, regenerates the lock with npm 11 and opens (or updates) the pull request `chore/ui-lock-sync`.
name: lock-sync

on:
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-sync
  cancel-in-progress: false

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked] the step pushes a bot branch with the persisted token
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Clone the workspace repositories at their default branches
        run: node scripts/workspace.mjs clone --depth 1

      - name: Regenerate the lock (npm 11)
        working-directory: orazaka-apps/ui
        run: npx -y npm@11 install --legacy-peer-deps --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Open or update the pull request when the lock drifted
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN || github.token }}
        run: |
          if git diff --quiet -- orazaka-apps/ui/package-lock.json; then
            echo "the workspace lock is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/ui-lock-sync
          git add orazaka-apps/ui/package-lock.json
          git commit -m "chore(deps): regenerate the workspace lock (the components' floors moved)"
          git push --force origin chore/ui-lock-sync  # bot-owned branch: rebuilt from main every run
          if ! gh pr list --repo "$GITHUB_REPOSITORY" --head chore/ui-lock-sync --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head chore/ui-lock-sync \
              --title "chore(deps): regenerate the workspace lock (the components' floors moved)" \
              --body "Generated by .github/workflows/lock-sync.yml: orazaka-apps/ui/package-lock.json regenerated with npm 11 against the components at their default branches."
          fi
          # A PR opened with GITHUB_TOKEN starts no workflow: dispatch CI on the branch once it exists, so its checks land on the PR.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref chore/ui-lock-sync
