# Orazaka Desktop (apps/desktop): checks on every pull request that touches it, and on a `desktop-v*` tag a macOS
# build (arm64 .dmg, unsigned until the Apple Developer ID exists) attached to a GitHub Release.
name: Desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: desktop check
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: "22"
      - run: npm install -g pnpm@12.10.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
          lookup-only: true
      - run: pnpm install --frozen-lockfile
      - name: Bundle the orazaka CLI
        run: pnpm sidecar
      - name: Types, UI tests, Rust tests (scope, sidecar allow-list, settings, files)
        run: pnpm check
      - name: Frontend build
        run: pnpm build:ui

  release:
    name: desktop dmg
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: "22"
      - run: npm install -g pnpm@12.10.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
          lookup-only: true
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the app version
        run: |
          v="${GITHUB_REF_NAME#desktop-v}"
          app="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          [ "${v%%-*}" = "$app" ] && [ "$app" = "$conf" ] || { echo "tag $v, package $app, tauri $conf must agree"; exit 1; }
      - name: Write the App Store Connect API key (notarization)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            umask 077
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key" >> "$GITHUB_ENV"
          fi
      - name: Is there a usable Developer ID certificate?
        id: cert
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$CERT" ] && printf '%s' "$CERT" | base64 -d > "$RUNNER_TEMP/cert.bin" 2>/dev/null \
             && security create-keychain -p tmp "$RUNNER_TEMP/probe.keychain" \
             && security import "$RUNNER_TEMP/cert.bin" -k "$RUNNER_TEMP/probe.keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign >/dev/null 2>&1; then
            echo "usable=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no usable Developer ID certificate: the .dmg is ad-hoc signed (right-click, Open)"
            echo "usable=no" >> "$GITHUB_OUTPUT"
          fi
          security delete-keychain "$RUNNER_TEMP/probe.keychain" >/dev/null 2>&1 || true
      - name: Build the .dmg (Developer ID signed and notarized when the secrets exist, ad-hoc otherwise)
        env:
          # Tauri signs with the Developer ID Application certificate and notarizes with the App Store Connect API key:
          # APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_API_ISSUER, APPLE_API_KEY (key id), APPLE_API_KEY_P8 (the key file, written above), APPLE_TEAM_ID.
          APPLE_CERTIFICATE: ${{ steps.cert.outputs.usable == 'yes' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.cert.outputs.usable == 'yes' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ steps.cert.outputs.usable == 'yes' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # An empty variable still counts as set for Tauri: with no usable certificate every APPLE_* signing variable is unset.
        run: |
          if [ "${{ steps.cert.outputs.usable }}" = yes ]; then pnpm build:app; else env -u APPLE_CERTIFICATE -u APPLE_CERTIFICATE_PASSWORD -u APPLE_SIGNING_IDENTITY -u APPLE_API_ISSUER -u APPLE_API_KEY -u APPLE_API_KEY_PATH -u APPLE_TEAM_ID pnpm build:app; fi
      - name: Checksum
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" ./*.dmg ./*.sha256 --clobber \
            || gh release create "$GITHUB_REF_NAME" ./*.dmg ./*.sha256 $flags \
                 --title "Orazaka Desktop ${GITHUB_REF_NAME#desktop-v}" \
                 --notes "Orazaka Desktop for macOS (Apple Silicon). Unsigned until the Apple Developer ID exists: right-click the app, then Open. See apps/desktop/README.md."
