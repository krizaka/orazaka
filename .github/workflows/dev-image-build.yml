# Guard: the dev images must still BUILD (no push). On 2026-10-31 every dev rebuild of `core` failed to resolve krizaka-parent 0.3.x
# (the Krizaka building blocks moved to GitHub Packages, ADR-019) and nothing in a pull request noticed: the deploy did. This job
# builds infra/deploy/Dockerfile with the network to the registries and the read credential as a build argument taken from the
# environment (never typed, never printed), so a resolution break fails the PR. It runs on a change to a Dockerfile or to the
# build configuration, and weekly (a release elsewhere can break the resolution without a change here).
name: Dev image build

on:
  pull_request:
    paths:
      - "infra/deploy/Dockerfile"
      - "infra/deploy/run-services.sh"
      - "infra/deploy/*.app.yaml"
      - "infra/compute-nodes/Dockerfile.worker"
      - "orazaka.workspace.json"
      - "scripts/workspace.mjs"
      - ".mvn/**"
      - "mvnw"
      - "pom.xml"
      - ".github/workflows/dev-image-build.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dev-image-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAVEN_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the core image (no push)
        run: docker build --progress=plain --build-arg MAVEN_GITHUB_PACKAGES_TOKEN --build-arg "CORE_REBUILD=ci-${GITHUB_RUN_ID}" -f infra/deploy/Dockerfile -t orazaka-core:ci .
